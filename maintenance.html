ong{display:block;font-size:16px;margin-bottom:4px}.notice span{display:block;font-size:14px;line-height:1.5;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:min(100%,570px)}.btn{appearance:none;text-decoration:none;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:13px;font:650 16px inherit;font-size:16px;font-weight:700;transition:transform .18s,box-shadow .18s,background .18s}.btn:hover{transform:translateY(-2px)}.primary{color:white;background:linear-gradient(105deg,#07945a,#078653);box-shadow:0 9px 20px rgba(7,141,86,.16);flex:1}.secondary{color:var(--green);background:#fff;border-color:#cfe7da;flex:1}.btn:focus-visible{outline:3px solid #8dd6b2;outline-offset:3px}.footer{margin-top:auto;padding-top:30px;font-size:12px;color:#8aa398}.decor{position:absolute;border-radius:24px;transform:rotate(45deg);background:#e7f5ed;opacity:.72;pointer-events:none}.decor.a{width:110px;height:110px;left:-35px;top:190px}.decor.b{width:70px;height:70px;right:5%;top:115px}.decor.c{width:55px;height:55px;right:9%;bottom:100px;background:#d7eee2}
